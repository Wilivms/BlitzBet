[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
via_ir = false

[rpc_endpoints]
monad_testnet = "https://testnet-rpc.monad.xyz/"

[etherscan]
monad_testnet = { key = "${MONADSCAN_API_KEY}", chain = 10143, url = "https://testnet.monadscan.com/api" }
